name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trivia
          POSTGRES_PASSWORD: trivia
          POSTGRES_DB: trivia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trivia"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TRIVIA_TEST_DATABASE_URL: postgresql+asyncpg://trivia:trivia@localhost:5432/trivia
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sync dependencies (locked)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check (strict)
        run: uv run mypy

      - name: Tests
        run: uv run pytest -q

  # Guard the guard: the purity tests are what enforce the architecture's
  # central invariants (no await in the domain, framework-free imports), so
  # surface them as their own required check for PR review clarity.
  invariants:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run pytest tests/game/test_purity.py -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # A broken image should fail the PR, not the deploy.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: anime-trivia-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: anime-trivia-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The container must actually come up and serve, not merely build.
      - name: Smoke the backend image
        run: |
          docker run -d --name api -p 8000:8000 anime-trivia-api:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/api/health > /dev/null; then
              echo "healthy"; curl -s http://localhost:8000/api/modes; exit 0
            fi
            sleep 1
          done
          echo "never became healthy"; docker logs api; exit 1
