name: Deploy API

# Manual only, on purpose. Every push already runs the full gate in ci.yml;
# shipping is a decision, not a side effect of merging.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'type "deploy" to confirm'
        required: true

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  id-token: write # required to request the GitHub OIDC token
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: anime-trivia-api

jobs:
  deploy:
    if: inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assume the deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA::12}"
          docker build -t "$IMAGE" -t "$REGISTRY/$ECR_REPOSITORY:latest" ./backend
          docker push "$IMAGE"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # No SSH, no open port 22, no key material: Run Command reaches the box
      # through the SSM agent using the instance's own IAM identity.
      - name: Roll the container
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::12}" \
            --parameters "commands=[\"ECR_IMAGE=$IMAGE /opt/trivia/deploy.sh\"]" \
            --query 'Command.CommandId' --output text)

          echo "command $COMMAND_ID"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '{status:Status,out:StandardOutputContent,err:StandardErrorContent}' \
            --output text
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" --query Status --output text)
          test "$STATUS" = "Success"

      - name: Verify the deployed API is healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fs "https://${{ vars.API_DOMAIN }}/api/health"; then exit 0; fi
            sleep 3
          done
          echo "health check never passed"; exit 1
