# Local development database (M4). The api + web services join in M7;
# production points at Neon and drops this entirely.
#
# Port 5433 on purpose: avoids colliding with any system postgres on 5432,
# and matches the dev default DATABASE_URL baked into alembic.ini and
# app/db/seed.py.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trivia
      POSTGRES_PASSWORD: trivia
      POSTGRES_DB: trivia
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trivia"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dbdata:
