# Local full stack: docker compose up  ->  game at http://localhost:8080
# (dev with hot reload stays `uvicorn --reload` + `npm run dev`, no docker).
# Production runs api behind Caddy on EC2 and points DATABASE_URL at Neon;
# the web static half lives on Vercel and this db service disappears.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trivia
      POSTGRES_PASSWORD: trivia
      POSTGRES_DB: trivia
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trivia"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://trivia:trivia@db:5432/trivia
      SEED_ON_START: "1"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  dbdata:
