[project]
name = "anime-trivia-backend"
version = "0.1.0"
description = "Real-time multiplayer anime trivia — server-authoritative game backend"
requires-python = ">=3.12"
# Runtime deps arrive in M2 (fastapi, uvicorn, websockets). M1 is pure stdlib
# by design: app/game/ must stay framework-free (see the architecture invariants).
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.141.1",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.6.9",
    "mypy>=1.11",
    "pytest-asyncio>=1.4.0",
    "httpx2>=2.12.0",
]

[tool.uv]
package = false
# This dev machine sits behind TLS interception; harmless elsewhere (incl. CI).
system-certs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["db: requires a reachable postgres (TRIVIA_TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
