[alembic]
script_location = migrations
prepend_sys_path = .
# The URL is resolved in migrations/env.py from DATABASE_URL; this value is
# the dev default and exists so `alembic` commands work with no env set.
sqlalchemy.url = postgresql+asyncpg://trivia:trivia@localhost:5433/trivia

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
